<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashwin Kumar Verma - JEE Main AI Mentor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Live Canvas Animation Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphic Aesthetic Styling */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
    }

    .neon-gradient-text {
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Background Live Motion Particles -->
  <canvas id="bg-canvas"></canvas>

  <!-- Aesthetic Header -->
  <header class="glass-card sticky top-0 z-50 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-indigo-500/20 ring-2 ring-indigo-400/30">
          AV
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-tight neon-gradient-text">Ashwin Kumar Verma</h1>
          <p class="text-xs text-indigo-300/80 font-medium tracking-wide">JEE Main AI Companion & Tracker</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div class="hidden sm:flex items-center space-x-2 bg-slate-950/70 border border-indigo-500/20 px-3.5 py-1.5 rounded-xl text-xs font-mono text-emerald-400 shadow-inner">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span>ashwin-kumar-verma.github.io</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10">

    <!-- Left Column: Syllabus Tracker & Daily Plan (7 Cols) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- Overall Progress Card -->
      <div class="glass-card rounded-3xl p-6 sm:p-7 relative overflow-hidden transition-all duration-300">
        <div class="flex justify-between items-start mb-4">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Overall Progress</span>
            <h2 class="text-3xl font-black text-white mt-1 tracking-tight" id="overall-percent">0% Completed</h2>
          </div>
          <button onclick="resetData()" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center gap-1 bg-slate-900/40 px-3 py-1.5 rounded-xl border border-slate-800">
            <i class="fa-solid fa-rotate-right"></i> Reset
          </button>
        </div>
        
        <div class="w-full bg-slate-950/80 rounded-full h-3.5 p-0.5 border border-indigo-500/20 mb-5 shadow-inner">
          <div id="overall-bar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full rounded-full transition-all duration-700 shadow-lg shadow-indigo-500/50" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-3 gap-3 text-center text-xs">
          <div class="bg-slate-900/60 p-3 rounded-2xl border border-indigo-500/10">
            <p class="text-slate-400 font-medium">Physics Core</p>
            <p id="physics-stat" class="font-extrabold text-indigo-300 text-sm mt-0.5">0 / 0</p>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-2xl border border-indigo-500/10">
            <p class="text-slate-400 font-medium">Chemistry</p>
            <p id="chem-stat" class="font-extrabold text-purple-300 text-sm mt-0.5">0 / 0</p>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-2xl border border-indigo-500/10">
            <p class="text-slate-400 font-medium">Mathematics</p>
            <p id="math-stat" class="font-extrabold text-emerald-300 text-sm mt-0.5">0 / 0</p>
          </div>
        </div>
      </div>

      <!-- Syllabus Topics Breakdown -->
      <div class="glass-card rounded-3xl p-6 sm:p-7">
        <h3 class="font-bold text-slate-200 mb-5 flex items-center gap-2.5 text-base">
          <i class="fa-solid fa-atom text-indigo-400 text-lg"></i> Syllabus & Core Modules
        </h3>
        
        <div id="topics-list" class="space-y-3 max-h-[340px] overflow-y-auto pr-2 chat-scroll">
          <!-- Dynamically Populated -->
        </div>
      </div>

      <!-- Active Plan & Deadlines -->
      <div class="glass-card rounded-3xl p-6 sm:p-7">
        <h3 class="font-bold text-slate-200 mb-3.5 flex items-center gap-2.5 text-base">
          <i class="fa-solid fa-calendar-check text-emerald-400 text-lg"></i> Daily Study Plan & Target
        </h3>
        <textarea id="daily-plan-input" rows="3" placeholder="Enter your plan (e.g., Practice 30 PYQs from Bohr Model & Dual Nature by Sunday)..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-indigo-500/60 transition resize-none shadow-inner"></textarea>
        <div class="flex justify-between items-center mt-3">
          <span id="save-status" class="text-xs font-semibold text-emerald-400 opacity-0 transition-opacity">✔ Saved to memory!</span>
          <button onclick="savePlan()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition flex items-center gap-2 shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-floppy-disk"></i> Save Plan for AI
          </button>
        </div>
      </div>

    </div>

    <!-- Right Column: AI Assistant Companion (5 Cols) -->
    <div class="lg:col-span-5 glass-card rounded-3xl p-6 flex flex-col h-[640px] lg:h-auto">
      
      <!-- AI Header -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-800/80">
        <div class="flex items-center space-x-3.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
            <i class="fa-solid fa-brain text-lg"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-white">Ashwin's AI Mentor</h3>
            <p class="text-[11px] text-emerald-400 font-medium">Online & Memory Active</p>
          </div>
        </div>
      </div>

      <!-- Chat Scroll Box -->
      <div id="chat-box" class="flex-1 overflow-y-auto my-4 space-y-4 pr-1 text-xs sm:text-sm chat-scroll">
        <!-- AI Welcome Message -->
      </div>

      <!-- Quick Prompt Pills -->
      <div class="flex gap-2 overflow-x-auto pb-2 chat-scroll">
        <button onclick="sendQuickPrompt('What is my current syllabus completion status?')" class="whitespace-nowrap bg-slate-900/80 hover:bg-indigo-950/80 border border-slate-800 text-slate-300 text-[11px] px-3.5 py-1.5 rounded-xl transition">
          📊 Syllabus Status
        </button>
        <button onclick="sendQuickPrompt('What was my saved daily study plan?')" class="whitespace-nowrap bg-slate-900/80 hover:bg-indigo-950/80 border border-slate-800 text-slate-300 text-[11px] px-3.5 py-1.5 rounded-xl transition">
          📅 Saved Plan
        </button>
      </div>

      <!-- Chat Input Area -->
      <div class="pt-3 border-t border-slate-800/80 flex gap-2">
        <input type="text" id="chat-input" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="Ask your AI mentor..." class="flex-1 bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500/60 transition shadow-inner">
        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-2xl text-xs font-bold transition flex items-center justify-center shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </div>

  </main>

  <script>
    const defaultTopics = [
      { id: 'p1', subject: 'Physics', title: 'Dual Nature of Matter', status: true },
      { id: 'p2', subject: 'Physics', title: 'Photoelectric Effect', status: true },
      { id: 'p3', subject: 'Physics', title: 'Bohr Model & Hydrogen Spectrum', status: true },
      { id: 'p4', subject: 'Physics', title: 'de Broglie Wavelength', status: true },
      { id: 'p5', subject: 'Physics', title: 'Radiation Pressure & Intensity', status: true },
      { id: 'p6', subject: 'Physics', title: 'X-Rays & Moseley Law', status: false },
      { id: 'p7', subject: 'Physics', title: 'Nuclei & Radioactivity Decay', status: false },
      { id: 'c1', subject: 'Chemistry', title: 'Organic Reaction Mechanisms', status: false },
      { id: 'm1', subject: 'Mathematics', title: 'Calculus & Integration', status: false }
    ];

    let state = {
      topics: JSON.parse(localStorage.getItem('ashwin_topics')) || defaultTopics,
      dailyPlan: localStorage.getItem('ashwin_daily_plan') || '',
      chatHistory: JSON.parse(localStorage.getItem('ashwin_chat')) || []
    };

    function init() {
      renderTopics();
      updateStats();
      document.getElementById('daily-plan-input').value = state.dailyPlan;
      renderChat();
      initCanvasAnimation();
    }

    function renderTopics() {
      const container = document.getElementById('topics-list');
      container.innerHTML = state.topics.map(t => `
        <div class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-950/60 border border-indigo-500/10 hover:border-indigo-500/30 transition">
          <div class="flex items-center space-x-3">
            <input type="checkbox" ${t.status ? 'checked' : ''} onchange="toggleTopic('${t.id}')" class="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-0 cursor-pointer">
            <span class="text-xs sm:text-sm font-semibold ${t.status ? 'text-emerald-400 line-through opacity-80' : 'text-slate-200'}">${t.title}</span>
          </div>
          <span class="text-[10px] uppercase font-bold px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-800 ${t.subject === 'Physics' ? 'text-indigo-400' : t.subject === 'Chemistry' ? 'text-purple-400' : 'text-emerald-400'}">${t.subject}</span>
        </div>
      `).join('');
    }

    function toggleTopic(id) {
      state.topics = state.topics.map(t => t.id === id ? { ...t, status: !t.status } : t);
      localStorage.setItem('ashwin_topics', JSON.stringify(state.topics));
      renderTopics();
      updateStats();
    }

    function updateStats() {
      const completed = state.topics.filter(t => t.status).length;
      const total = state.topics.length;
      const percent = Math.round((completed / total) * 100);

      document.getElementById('overall-percent').innerText = `${percent}% Completed`;
      document.getElementById('overall-bar').style.width = `${percent}%`;

      const phys = state.topics.filter(t => t.subject === 'Physics');
      document.getElementById('physics-stat').innerText = `${phys.filter(t => t.status).length} / ${phys.length}`;
    }

    function savePlan() {
      const plan = document.getElementById('daily-plan-input').value;
      state.dailyPlan = plan;
      localStorage.setItem('ashwin_daily_plan', plan);
      
      const status = document.getElementById('save-status');
      status.style.opacity = '1';
      setTimeout(() => status.style.opacity = '0', 2500);
    }

    function renderChat() {
      const box = document.getElementById('chat-box');
      let welcomeHtml = `
        <div class="flex justify-start">
          <div class="bg-slate-950/80 border border-indigo-500/20 text-slate-300 p-4 rounded-3xl rounded-tl-none max-w-[90%] leading-relaxed shadow-lg">
            Hello <b>Ashwin</b>! I am your personal AI Mentor. Your completed Modern Physics topics (Dual Nature, Photoelectric Effect, Bohr Model, de Broglie) are updated.<br><br>You can ask me about your <b>Syllabus Progress</b>, <b>Saved Plans</b>, or <b>PYQ Strategies</b> anytime!
          </div>
        </div>
      `;

      if (state.chatHistory.length === 0) {
        box.innerHTML = welcomeHtml;
        return;
      }

      const chatHtml = state.chatHistory.map(m => `
        <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
          <div class="${m.sender === 'user' ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-tr-none shadow-md shadow-indigo-600/20' : 'bg-slate-950/80 border border-indigo-500/20 text-slate-300 rounded-tl-none shadow-lg'} p-3.5 rounded-3xl max-w-[85%] leading-relaxed">
            ${m.text}
          </div>
        </div>
      `).join('');

      box.innerHTML = welcomeHtml + chatHtml;
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      state.chatHistory.push({ sender: 'user', text });
      input.value = '';
      renderChat();

      setTimeout(() => {
        let reply = generateAiReply(text);
        state.chatHistory.push({ sender: 'ai', text: reply });
        localStorage.setItem('ashwin_chat', JSON.stringify(state.chatHistory));
        renderChat();
      }, 400);
    }

    function sendQuickPrompt(promptText) {
      document.getElementById('chat-input').value = promptText;
      sendMessage();
    }

    function generateAiReply(msg) {
      const lower = msg.toLowerCase();
      const completed = state.topics.filter(t => t.status).map(t => t.title).join(', ');
      const pending = state.topics.filter(t => !t.status).map(t => t.title).join(', ');

      if (lower.includes('plan')) {
        return state.dailyPlan 
          ? `Ashwin, your saved daily plan is:\n"${state.dailyPlan}"`
          : `Ashwin, you haven't saved a daily plan yet. Enter your plan in the text box and click Save Plan!`;
      }

      if (lower.includes('status') || lower.includes('progress') || lower.includes('completion')) {
        return `Ashwin, according to your records, completed modules: **${completed}**.\n\nPending modules: **${pending}**.\nYou have completed over ~75% of pure Modern Physics!`;
      }

      return `Ashwin, I have recorded your message. Keep focusing on Nuclei and X-Rays, then jump straight into 2020-2025 PYQs!`;
    }

    function resetData() {
      if (confirm("Do you really want to reset your tracker data?")) {
        localStorage.clear();
        location.reload();
      }
    }

    function initCanvasAnimation() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 45; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 1,
          dx: (Math.random() - 0.5) * 0.4,
          dy: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.5 + 0.1
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(99, 102, 241, ${p.alpha})`;
          ctx.fill();

          p.x += p.dx;
          p.y += p.dy;

          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    window.onload = init;
  </script>
</body>
</html>
